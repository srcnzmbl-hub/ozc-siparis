<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Natal Harita · Ozark Collective</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/site_favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/natal-view.css">
<script>if(/[?&]id=/.test(location.search))document.documentElement.classList.add("rd")</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050507;color:#F5F0E6;font-family:Inter,system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.bg{position:absolute;inset:0 0 auto 0;height:100vh;overflow:hidden;pointer-events:none}
.bg img{width:100%;height:100%;object-fit:cover}
.bg:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 94% 90% at 50% 40%,transparent 28%,rgba(0,0,0,.35) 58%,rgba(0,0,0,.82) 80%,#000 96%);z-index:1}
.bg:after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(to bottom,transparent,#000);z-index:1}
main{position:relative;z-index:2;max-width:576px;margin:0 auto;padding:96px 24px 80px}
.top{position:absolute;z-index:3;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:22px 24px;font-size:11px;letter-spacing:.28em;text-transform:uppercase}
.top a{color:#c5a47e;text-decoration:none}
.kick{text-align:center;font-family:Geist,Inter,sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:.44em;color:rgba(197,164,126,.85)}
h1{margin-top:16px;text-align:center;font-family:Geist,Inter,sans-serif;font-weight:300;font-size:48px;line-height:1.1}
.rule{display:block;width:80px;height:1px;background:rgba(197,164,126,.6);margin:24px auto 0}
.sub{margin:22px auto 0;max-width:420px;text-align:center;font-size:15px;line-height:1.7;color:#9a9aa3}
form{margin-top:34px;display:flex;flex-direction:column;gap:20px;text-align:left;max-width:448px;margin-inline:auto}
label{display:block;margin-bottom:8px;font-family:Geist,Inter,sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:.3em;color:rgba(197,164,126,.85)}
input,select{width:100%;border:1px solid #25252d;background:#0d0d12;padding:13px 14px;font-size:16px;color:#f2f2f2;outline:none;font-family:inherit;border-radius:2px;-webkit-appearance:none;appearance:none}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23D4AF37' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:40px}
select option{background:#0b0b0b}
input:focus,select:focus{border-color:#c5a47e}
input::placeholder{color:#6f6a5c}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(197,164,126,.5);background:transparent;color:#c5a47e;padding:15px 30px;font-family:Geist,Inter,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.24em;border-radius:2px;cursor:pointer;transition:.2s;font-family:inherit;text-decoration:none}
.btn:hover{background:rgba(197,164,126,.12)}
.btn:disabled{opacity:.5;cursor:default}
.act{margin-top:34px;text-align:center}
.err{margin:22px auto 0;max-width:448px;border:1px solid rgba(201,139,139,.45);background:rgba(201,139,139,.08);color:#e3b4b4;padding:12px 14px;font-size:14px;line-height:1.55;text-align:center}
.load{text-align:center;padding-top:20vh}
.load .orb{width:54px;height:54px;margin:0 auto 28px;border:1px solid rgba(197,164,126,.35);border-top-color:#c5a47e;border-radius:50%;animation:sp 1.1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.load p{font-family:'Cormorant Garamond',serif;font-size:22px;color:#e8e1d2}
.load small{display:block;margin-top:10px;font-size:11px;letter-spacing:.2em;color:#8a8273;text-transform:uppercase}
.row2{display:flex;gap:14px;flex-wrap:wrap}.row2>div{flex:1 1 180px}
.hid{display:none!important}
.foot{margin-top:40px;display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
@media(max-width:520px){h1{font-size:42px}}
body:has(#vRead:not(.hid)) .bg,html.rd .bg{display:none}
main:has(#vRead:not(.hid)),html.rd main{width:min(100%,calc(100svh*9/16));max-width:none}
body:has(#vRead:not(.hid))::before,html.rd body::before{content:"";position:fixed;top:0;bottom:0;left:50%;width:min(100vw,calc(100svh*9/16));transform:translateX(-50%);background:url(/nebula_hero.webp) center/cover no-repeat;z-index:0;pointer-events:none}
.rd-ctrls{margin-top:40px;display:flex;align-items:center;justify-content:center;gap:12px}
.rd-cbtn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(232,190,96,.75);background:linear-gradient(180deg,rgba(58,26,8,.72),rgba(20,7,4,.9));color:#f7d98a;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 6px 18px rgba(0,0,0,.55),0 0 14px rgba(230,182,74,.28)}
.rd-cbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rd-cbtn:active{transform:scale(.93)}
.rd-cbtn{font-family:Inter,system-ui,sans-serif;font-size:11px;font-weight:600;letter-spacing:0}
.sw.cur{color:#f7d98a;background:rgba(212,175,55,.28);border-radius:3px}
.rd-cbtn.on{background:linear-gradient(180deg,#f4d488,#d29b3a);color:#3a1e06;border-color:transparent}
</style>
</head>
<body>
<div class="bg"><img src="/hero_planet.webp" alt=""></div>
<div class="top"><a href="/">← Ozark Collective</a><a href="/account.html">Hesabım</a></div>
<main>
 <section id="vForm" class="hid">
  <p class="kick">Natal Harita</p>
  <h1>Doğum Haritan</h1>
  <span class="rule"></span>
  <p class="sub">Doğum anının gökyüzü: gezegenler, evler, Ay düğümleri ve Lilith — senin için yorumlanır.</p>
  <form id="f" autocomplete="off">
   <div class="row2">
    <div><label for="firstName">İsim</label><input id="firstName" required placeholder="İsim"></div>
    <div><label for="lastName">Soyisim</label><input id="lastName" required placeholder="Soyisim"></div>
   </div>
   <div class="row2">
    <div><label for="birthdate">Doğum Tarihi</label><input id="birthdate" type="date" required></div>
    <div><label for="birthtime">Doğum Saati</label><input id="birthtime" type="time" required></div>
   </div>
   <div><label for="country">Ülke</label><select id="country" required></select></div>
   <div><label for="city" id="cityLbl">İl</label><span id="cityBox"></span></div>
   <div><label for="district">İlçe</label><input id="district" required placeholder="İlçe yaz…"></div>
   <div class="act" style="margin-top:14px"><button class="btn" id="go" type="submit">Haritamı Oluştur</button></div>
  </form>
  <div class="err hid" id="err"></div>
  <div class="foot"><a class="btn" href="/account.html?natal=1">Natal haritalarım</a></div>
 </section>

 <section id="vLoad" class="load hid">
  <div class="orb"></div>
  <p>Gökyüzü haritan çiziliyor…</p>
  <small>Bu işlem yarım dakika sürebilir</small>
 </section>

 <section id="vRead" class="hid">
  <p class="kick">Natal Harita</p>
  <h1 id="rTitle">Natal Harita</h1>
  <span class="rule"></span>
  <div id="rBody"></div>
  <div class="rd-ctrls">
   <button class="rd-cbtn" id="vbPlay" type="button" title="Oynat" aria-label="Oynat"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></button>
   <button class="rd-cbtn" id="vbPause" type="button" title="Duraklat" aria-label="Duraklat"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
   <button class="rd-cbtn" id="vbStop" type="button" title="Durdur" aria-label="Durdur"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button>
   <button class="rd-cbtn" id="vbMute" type="button" title="Sesi kapat / aç" aria-label="Sesi kapat"><svg viewBox="0 0 24 24" id="vbMuteIc"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a9 9 0 0 1 0 12"/></svg></button>
   <button class="rd-cbtn" id="vbSpeed" type="button" title="Hız" aria-label="Hız">1.0x</button>
  </div>
  <div class="foot">
   <button class="btn" id="again" type="button">Yeni Harita</button>
   <a class="btn" href="/account.html?natal=1">Natal haritalarım</a>
  </div>
 </section>
 <div class="err hid" id="gate"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/natal-data.js"></script>
<script src="/natal-view.js"></script>
<script>
var SUPABASE_URL="https://lssyopqxthausyegeire.supabase.co";
var SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxzc3lvcHF4dGhhdXN5ZWdlaXJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMTE4MzEsImV4cCI6MjA5OTc4NzgzMX0.WZeL9kPQmC86m747B3jOOObcNR0If4FADH12VxUpFqo";
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
var $=function(i){return document.getElementById(i)};
var user=null,tick=0;

function show(v){['vForm','vLoad','vRead'].forEach(function(x){$(x).classList.toggle('hid',x!==v)});window.scrollTo(0,0);}
function showErr(t){var e=$('err');e.textContent=t;e.classList.remove('hid');}

/* ---- form ---- */
(function(){
  var c=$('country');c.innerHTML='<option value="" disabled selected>Ülke seç…</option>'+NATAL_COUNTRIES.map(function(x){return'<option>'+x+'</option>'}).join('');
  function city(){
    var tr=c.value==='Türkiye'||!c.value;
    $('cityLbl').textContent=tr?'İl':'Şehir';
    $('cityBox').innerHTML=tr
      ?'<select id="city" required><option value="" disabled selected>İl seç…</option>'+NATAL_CITIES.map(function(x){return'<option>'+x+'</option>'}).join('')+'</select>'
      :'<input id="city" required placeholder="Şehir yaz…">';
  }
  c.addEventListener('change',city);city();
})();

function render(chart,sections){
  $('rBody').innerHTML=NatalView.html(chart,sections,++tick);
  show('vRead');
}

async function save(text,girdi){
  try{
    await sb.from('fal_kayitlari').insert({kullanici_id:user.id,fal_turu:'natal',yorum:text||'',girdi:girdi,saglayici:'client',durum:'tamam',platform:'web-v3'});
  }catch(e){}
}

async function errMsg(error,data){
  var d=data;
  try{if(!d&&error&&error.context&&error.context.json)d=await error.context.json();}catch(e){}
  if(d&&d.kota_doldu) return 'Bu dönem için natal harita hakkın doldu. Daha sonra tekrar dene.';
  if(d&&(d.message||d.error)) return d.message||d.error||'Bu haritayı şu an oluşturamazsın.';
  return 'Bir an için gökyüzü bulutlandı. Birazdan tekrar dene.';
}

$('f').addEventListener('submit',async function(ev){
  ev.preventDefault();$('err').classList.add('hid');
  var v={firstName:$('firstName').value.trim(),lastName:$('lastName').value.trim(),birthdate:$('birthdate').value,birthtime:$('birthtime').value,country:$('country').value,city:$('city').value.trim(),district:$('district').value.trim()};
  var name=[v.firstName,v.lastName].filter(Boolean).join(' ');
  show('vLoad');
  try{
    var r=await sb.functions.invoke('natal-fali',{body:{name:name,birthdate:v.birthdate,birthtime:v.birthtime,country:v.country,city:v.city,district:v.district,lang:'tr'}});
    var d=r.data;
    if(r.error||!d||d.kota_doldu){show('vForm');showErr(await errMsg(r.error,d));return;}
    if(d.chart&&d.sections){
      render(d.chart,d.sections);
      save(d.text,Object.assign({},v,{chart:d.chart,sections:d.sections}));
    }else if(d.text){
      show('vRead');$('rBody').innerHTML='<p class="nv-ozet">'+String(d.text).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</p>';
      save(d.text,Object.assign({},v,{chart:d.chart||null}));
    }else{show('vForm');showErr('Gökyüzü haritan bir an için bulutlandı. Birazdan tekrar dene.');}
  }catch(e){show('vForm');showErr('Bir an için gökyüzü bulutlandı. Birazdan tekrar dene.');}
});
$('again').addEventListener('click',function(){history.replaceState(null,'','/natalchart');show('vForm');});

/* ---- boot: login gate ---- */
(async function(){
  var s=(await sb.auth.getSession()).data.session;
  if(!s||!s.user){location.replace('/account.html?next='+encodeURIComponent('/natalchart'+location.search));return;}
  user=s.user;
  var id=new URLSearchParams(location.search).get('id');
  if(id){
    var q=await sb.from('fal_kayitlari').select('id,yorum,girdi,created_at').eq('id',id).eq('fal_turu','natal').eq('kullanici_id',user.id).maybeSingle();
    var g=q.data&&q.data.girdi;
    if(g&&g.chart&&g.sections){render(g.chart,g.sections);return;}
    if(q.data&&q.data.yorum){show('vRead');$('rBody').textContent=q.data.yorum;$('rBody').className='nv-ozet';return;}
  }
  show('vForm');
})();
/* sesli okuma: oynat/duraklat, durdur, sessiz, hız + kelime takibi */
(function(){
var TTS=window.speechSynthesis,ok=!!(TTS&&window.SpeechSynthesisUtterance);
var RATES=[1.0,1.25,1.5,1.75,2.0],ri=0,muted=false,playing=false,idx=0,gen=0,words=[],timer=null,cur=null;
var SPK='<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a9 9 0 0 1 0 12"/>',SPKX='<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/>';
function ui(){$('vbPlay').classList.toggle('on',playing);$('vbPause').classList.toggle('on',!playing&&idx>0);$('vbMuteIc').innerHTML=muted?SPKX:SPK;$('vbMute').classList.toggle('on',muted);var r=RATES[ri];$('vbSpeed').textContent=(Number.isInteger(r)?r.toFixed(1):(''+r).padEnd(4,'0'))+'x';}
function wrap(){
var body=$('rBody');if(body.querySelector('.sw'))return;words=[];idx=0;cur=null;
var tw=document.createTreeWalker(body,NodeFilter.SHOW_TEXT,{acceptNode:function(n){if(!n.nodeValue.trim())return NodeFilter.FILTER_REJECT;if(n.parentNode.closest('.nv-map,.rd-ctrls,script,style,iframe'))return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT;}});
var nodes=[];while(tw.nextNode())nodes.push(tw.currentNode);
nodes.forEach(function(n){var f=document.createDocumentFragment();n.nodeValue.split(/(\s+)/).forEach(function(p){if(!p)return;if(/^\s+$/.test(p)){f.appendChild(document.createTextNode(p));return;}var sp=document.createElement('span');sp.className='sw';sp.textContent=p;words.push(sp);f.appendChild(sp);});n.parentNode.replaceChild(f,n);});
}
function mark(i){if(cur)cur.classList.remove('cur');cur=words[i]||null;if(cur)cur.classList.add('cur');}
function clearT(){if(timer){clearTimeout(timer);timer=null;}}
function voice(){var v=(TTS.getVoices()||[]).filter(function(x){return /^tr([-_]|$)/i.test(x.lang)||/turk/i.test(x.name)});if(!v.length)return null;
function sc(x){var n=x.name||'',r=0;if(/natural|neural/i.test(n))r+=4;if(/online/i.test(n))r+=2;if(/google/i.test(n))r+=2;if(!x.localService)r+=1;return r;}
v.sort(function(p,q){return sc(q)-sc(p);});return v[0];}
function say(w){return w.replace(/(\d)°/g,'$1 derece ').replace(/(\d)['’′]/g,'$1 dakika ').replace(/^[·•]+$/,',').replace(/\//g,' ').replace(/\s+/g,' ').trim()||',';}
function speakFrom(i,fresh){
clearT();gen++;var my=gen;
if(fresh){try{TTS.cancel();}catch(e){}}
if(i>=words.length){finish();return;}
idx=i;var end=i,len=0;while(end<words.length-1){len+=words[end].textContent.length+1;if(/[.!?…]["”)]?$/.test(words[end].textContent)&&len>40)break;if(len>170)break;end++;}
var offs=[],txt='';for(var k=i;k<=end;k++){offs.push(txt.length);txt+=(k>i?' ':'')+say(words[k].textContent);}
mark(i);
setTimeout(function(){if(my!==gen)return;
var u=new SpeechSynthesisUtterance(txt);window.__oph_u=u;u.lang='tr-TR';u.rate=RATES[ri];u.volume=muted?0:1;var v=voice();if(v){u.voice=v;u.lang=v.lang||'tr-TR';}
var gotB=false;
function at(c){var w=0;for(var q=0;q<offs.length;q++){if(offs[q]<=c)w=q;else break;}return i+w;}
u.onboundary=function(e){if(my!==gen)return;gotB=true;clearT();var w=at(e.charIndex||0);idx=w;mark(w);};
u.onstart=function(){if(my!==gen)return;setTimeout(function(){if(my!==gen||gotB)return;
var wi=i;(function tick(){if(my!==gen||gotB)return;idx=wi;mark(wi);var ms=(words[wi].textContent.length+1)*72/RATES[ri];wi++;if(wi<=end)timer=setTimeout(tick,ms);})();},500);};
u.onend=function(){if(my!==gen)return;clearT();speakFrom(end+1,false);};
u.onerror=function(e){if(my!==gen)return;clearT();if(e&&(e.error==='interrupted'||e.error==='canceled'))return;playing=false;ui();};
TTS.speak(u);},fresh?160:0);
}
function finish(){playing=false;idx=0;if(cur){cur.classList.remove('cur');cur=null;}ui();}
function play(){if(!ok)return;wrap();if(!words.length)return;playing=true;ui();speakFrom(idx,true);}
function pause(){gen++;clearT();try{TTS.cancel();}catch(e){}playing=false;ui();}
function stop(){gen++;clearT();try{if(ok)TTS.cancel();}catch(e){}playing=false;idx=0;if(cur){cur.classList.remove('cur');cur=null;}ui();}
if(!ok){$('vbPlay').parentNode.style.display='none';}else{
$('vbPlay').addEventListener('click',function(){if(!playing)play();});
$('vbPause').addEventListener('click',function(){if(playing)pause();});
$('vbStop').addEventListener('click',stop);
$('vbMute').addEventListener('click',function(){muted=!muted;ui();if(playing)speakFrom(idx,true);});
$('vbSpeed').addEventListener('click',function(){ri=(ri+1)%RATES.length;ui();if(playing)speakFrom(idx,true);});
window.addEventListener('pagehide',stop);$('again').addEventListener('click',stop);ui();}
})();
</script>
</body>
</html>
