<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account · Ozark Collective</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="site_favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#050507;--fg:#f2f2f2;--card:#0d0d12;--gold:#c5a47e;--muted:#9a9aa3;--line:#25252d;--err:#e3a0a0;--ok:#9fd8b5}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;line-height:1.6;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:var(--gold);text-decoration:none}
.wrap{max-width:440px;margin:0 auto;padding:48px 20px 60px}
.mark{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:34px}
.mark img{width:56px;height:56px;border-radius:50%;object-fit:contain}
.mark span{font-family:Geist,Inter,sans-serif;text-transform:uppercase;letter-spacing:.3em;font-size:11px;color:rgba(242,242,242,.9)}
.card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:32px 26px}
h1{font-family:Geist,Inter,sans-serif;font-weight:300;font-size:28px;line-height:1.2;text-align:center;margin-bottom:8px}
.tagline{text-align:center;color:var(--muted);font-size:14px;margin-bottom:24px}
.tabs{display:flex;gap:8px;margin-bottom:22px}
.tab{flex:1;font-family:Geist,Inter,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.24em;padding:13px 10px;border:1px solid var(--line);color:var(--muted);background:transparent;border-radius:2px;cursor:pointer;transition:background .25s,color .25s}
.tab.on{border-color:rgba(197,164,126,.5);color:var(--gold);background:rgba(197,164,126,.12)}
label{display:block;font-family:Geist,Inter,sans-serif;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(197,164,126,.85);margin:16px 0 8px}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:13px 14px;color:var(--fg);font-family:Inter,system-ui,sans-serif;font-size:16px;outline:none}
select{-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23c5a47e' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:40px}
input:focus,select:focus{border-color:rgba(197,164,126,.6)}
input[readonly]{color:var(--muted)}
.hint{color:var(--muted);font-size:12.5px;margin-top:6px}
.btn{display:block;width:100%;text-align:center;font-family:Geist,Inter,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.24em;padding:15px 30px;border:1px solid rgba(197,164,126,.5);color:var(--gold);background:transparent;border-radius:2px;cursor:pointer;transition:background .25s,color .25s}
.btn:hover{background:rgba(197,164,126,.12)}
.btn.f{background:rgba(197,164,126,.95);color:#08080b;border-color:transparent;margin-top:24px}
.btn.f:hover{background:var(--gold)}
.btn:disabled{opacity:.6;cursor:default}
.msg{margin-top:16px;padding:12px 14px;border-radius:2px;font-size:14px;display:none;line-height:1.5}
.msg.err{background:rgba(227,160,160,.08);border:1px solid rgba(227,160,160,.4);color:var(--err);display:block}
.msg.ok{background:rgba(159,216,181,.08);border:1px solid rgba(159,216,181,.4);color:var(--ok);display:block}
.alt{text-align:center;margin-top:18px;font-size:14px;color:var(--muted)}
.alt a{cursor:pointer}
.secure{text-align:center;margin-top:22px;color:var(--muted);font-size:12.5px}
.back{display:block;text-align:center;margin-top:26px;color:var(--muted);font-size:13px}
#account{display:none}
.acct-email{text-align:center;color:var(--gold);font-family:Geist,Inter,sans-serif;font-size:16px;word-break:break-all;margin:6px 0 4px}
.acct-row{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.logout{border-color:rgba(227,160,160,.4);color:var(--err)}
.logout:hover{background:rgba(227,160,160,.08)}
.panel{display:none;border:1px solid var(--line);border-radius:2px;padding:4px 18px 20px}
.nl-i{display:block;text-align:left;padding:13px 14px;border:1px solid var(--line);border-radius:2px;margin-top:10px;color:var(--fg)}
.nl-i:hover{background:rgba(197,164,126,.08)}
.nl-i b{display:block;font-family:Geist,Inter,sans-serif;font-weight:400;font-size:14px;color:var(--gold)}
.nl-i span{font-size:13px;color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(8,8,11,.35);border-top-color:#08080b;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
<div class="mark"><img src="site_logo.png" alt=""><span>Ozark Collective Co.</span></div>

<!-- AUTH CARD -->
<div class="card" id="auth">
<h1 id="title">Create Your Account</h1>
<div class="tagline" id="tagline">One account for your Ozark Collective orders and natal charts.</div>

<div class="tabs">
<button class="tab on" id="tab_signup" type="button">Sign Up</button>
<button class="tab" id="tab_login" type="button">Log In</button>
</div>

<form id="form" autocomplete="on">
<label for="email">Email</label>
<input id="email" type="email" required autocomplete="email" placeholder="you@email.com">

<label for="password">Password</label>
<input id="password" type="password" required autocomplete="current-password" placeholder="••••••••">
<div class="hint" id="pwhint">At least 6 characters.</div>

<button class="btn f" id="submit" type="submit">Create Account</button>
<div class="msg" id="msg"></div>
</form>

<div id="gwrap" style="display:none">
<div class="alt">or</div>
<button class="btn" id="google_btn" type="button" style="margin-top:14px"><svg width="16" height="16" viewBox="0 0 48 48" style="vertical-align:-3px;margin-right:10px" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.3.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.3 0 11.7-2.1 15.6-5.7l-7.5-5.8c-2.1 1.4-4.8 2.3-8.1 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Continue with Google</button>
</div>

<div class="alt" id="forgot" style="display:none">
<a id="forgot_link">Forgot your password?</a>
</div>

<div class="secure">Secure sign-in · your password is encrypted, never stored by us</div>
</div>

<!-- LOGGED-IN CARD -->
<div class="card" id="account">
<h1>Welcome back</h1>
<div class="acct-email" id="acct_email"></div>
<div class="tagline">You're signed in.</div>
<div class="acct-row">
<button class="btn" id="natal_btn" type="button">My Natal Charts</button>
<div class="panel" id="natal_list"></div>
<button class="btn" id="info_btn" type="button">Personal Information</button>
<div class="panel" id="info_panel">
<label for="pi_email">Email</label>
<input id="pi_email" readonly>
<label for="pi_lang">Language</label>
<select id="pi_lang">
<option value="en">English</option>
<option value="tr">Türkçe</option>
<option value="es">Español</option>
<option value="de">Deutsch</option>
<option value="fr">Français</option>
<option value="it">Italiano</option>
<option value="pt">Português</option>
<option value="nl">Nederlands</option>
<option value="pl">Polski</option>
<option value="id">Bahasa Indonesia</option>
<option value="ru">Русский</option>
<option value="ar">العربية</option>
<option value="ja">日本語</option>
<option value="ko">한국어</option>
<option value="zh">中文</option>
</select>
<button class="btn f" id="pi_save" type="button" style="margin-top:18px">Save</button>
<div class="msg" id="pi_msg"></div>
</div>
<button class="btn logout" id="logout" type="button">Log Out</button>
</div>
</div>

<a class="back" href="index.html">← Back to Ozark Collective</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

/* ---- Supabase Auth (shared between website + app) ---- */
const SUPABASE_URL="https://lssyopqxthausyegeire.supabase.co";
const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxzc3lvcHF4dGhhdXN5ZWdlaXJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMTE4MzEsImV4cCI6MjA5OTc4NzgzMX0.WZeL9kPQmC86m747B3jOOObcNR0If4FADH12VxUpFqo";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }
});

const $=id=>document.getElementById(id);
let mode='signup';

/* language preference (stored on the account; detected from the browser at sign-up) */
var LANGS=['en','tr','es','de','fr','it','pt','nl','pl','id','ru','ar','ja','ko','zh'];
function detectLang(){var l=null;try{l=localStorage.getItem('ophanark_lang');}catch(e){}
if(!l){var nv=(navigator.language||'en').slice(0,2).toLowerCase();if(LANGS.indexOf(nv)>=0)l=nv;}
return LANGS.indexOf(l)>=0?l:'en';}

function setMode(m){
mode=m;
const su=m==='signup';
$('tab_signup').classList.toggle('on',su);
$('tab_login').classList.toggle('on',!su);
$('title').textContent = su?'Create Your Account':'Welcome Back';
$('tagline').textContent = su?'One account for your Ozark Collective orders and natal charts.':'Log in to your account.';
$('submit').textContent = su?'Create Account':'Log In';
$('password').setAttribute('autocomplete', su?'new-password':'current-password');
$('pwhint').style.display = su?'block':'none';
$('forgot').style.display = su?'none':'block';
clearMsg();
}
$('tab_signup').onclick=()=>setMode('signup');
$('tab_login').onclick=()=>setMode('login');

function msg(t,ok){const m=$('msg');m.textContent=t;m.className='msg '+(ok?'ok':'err');}
function clearMsg(){const m=$('msg');m.textContent='';m.className='msg';}
function busy(on,label){const b=$('submit');b.disabled=on;b.innerHTML=on?('<span class="spin"></span>'+label):label;}

/* show logged-in state */
function nextUrl(){var n=new URLSearchParams(location.search).get('next');return (n&&n.charAt(0)==='/'&&n.charAt(1)!=='/')?n:null;}
function showAccount(user){
var nx=nextUrl();if(nx){location.replace(nx);return;}
$('auth').style.display='none';
$('account').style.display='block';
$('acct_email').textContent=user.email||'';
$('pi_email').value=user.email||'';
var ul=(user.user_metadata&&user.user_metadata.language)||detectLang();if(LANGS.indexOf(ul)>=0)$('pi_lang').value=ul;
}
function showAuth(){
$('account').style.display='none';
$('auth').style.display='block';
}

/* Natal haritalarım */
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
async function loadNatal(){
var box=$('natal_list');box.style.display='block';$('info_panel').style.display='none';box.innerHTML='<div class="hint" style="text-align:center">Loading…</div>';
var u=(await sb.auth.getUser()).data.user;if(!u){box.innerHTML='';return;}
var r=await sb.from('fal_kayitlari').select('id,girdi,created_at').eq('kullanici_id',u.id).eq('fal_turu','natal').order('created_at',{ascending:false}).limit(40);
var rows=r.data||[];
var h=rows.map(function(x){var g=x.girdi||{};var nm=[g.firstName,g.lastName].filter(Boolean).join(' ')||g.name||'Natal Chart';
var d=new Date(x.created_at).toLocaleDateString('en-US',{day:'numeric',month:'long',year:'numeric'});
var meta=[g.birthdate,[g.district,g.city].filter(Boolean).join(', ')].filter(Boolean).join(' · ');
return '<a class="nl-i" href="/natalchart?id='+encodeURIComponent(x.id)+'"><b>'+esc(nm)+'</b><span>'+esc(meta)+(meta?' · ':'')+esc(d)+'</span></a>';}).join('');
if(!rows.length)h='<div class="hint" style="text-align:center">You have no natal charts yet.</div>';
box.innerHTML=h+'<a class="btn nl-new" style="margin-top:12px" href="/natalchart">New natal chart</a>';
}
$('info_btn').addEventListener('click',function(){var p=$('info_panel');var open=p.style.display==='block';p.style.display=open?'none':'block';$('natal_list').style.display='none';$('pi_msg').className='msg';});
$('pi_save').addEventListener('click',async function(){var l=$('pi_lang').value;var m=$('pi_msg');$('pi_save').disabled=true;var r=await sb.auth.updateUser({data:{language:l}});$('pi_save').disabled=false;if(r.error){m.className='msg err';m.textContent=r.error.message;return;}try{localStorage.setItem('ophanark_lang',l);}catch(e){}m.className='msg ok';m.textContent='Saved.';});
$('natal_btn').addEventListener('click',function(){var b=$('natal_list');if(b.style.display==='block'){b.style.display='none';return;}loadNatal();});

/* on load: if already signed in, show account */
sb.auth.getSession().then(({data})=>{
if(data.session && data.session.user){ showAccount(data.session.user); if(new URLSearchParams(location.search).get('natal')) loadNatal(); }
else showAuth();
});
sb.auth.onAuthStateChange((_e,session)=>{
if(session && session.user) showAccount(session.user); else showAuth();
});

/* submit: sign up or log in */
$('form').addEventListener('submit', async e=>{
e.preventDefault();
clearMsg();
const email=$('email').value.trim();
const password=$('password').value;
const lang=detectLang();
if(!email){ msg('Please enter your email.'); return; }
if(mode==='signup' && password.length<6){ msg('Password must be at least 6 characters.'); return; }

if(mode==='signup'){
busy(true,'Creating…');
const {data,error}=await sb.auth.signUp({email,password,options:{data:{language:lang},emailRedirectTo:location.origin+'/account.html'}});
busy(false,'Create Account');
if(error){ msg(error.message); return; }
if(data.session && data.session.user){ showAccount(data.session.user); return; }
// email confirmation is required on the project
msg('Account created! Please check your email ('+email+') to confirm your account, then log in.', true);
setMode('login');
$('email').value=email;
} else {
busy(true,'Logging in…');
const {data,error}=await sb.auth.signInWithPassword({email,password});
busy(false,'Log In');
if(error){
let m=error.message;
if(/invalid login/i.test(m)) m='Wrong email or password. Please try again.';
if(/not confirmed/i.test(m)) m='Please confirm your email first — check your inbox for the confirmation link.';
msg(m); return;
}
if(data.session && data.session.user){ showAccount(data.session.user); }
}
});

/* forgot password */
$('forgot_link').addEventListener('click', async ()=>{
const email=$('email').value.trim();
if(!email){ msg('Enter your email above first, then click "Forgot your password?".'); return; }
const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/account.html'});
if(error){ msg(error.message); return; }
msg('If an account exists for '+email+', a password-reset link is on its way to your inbox.', true);
});

/* Google sign-in: shown only when the Google provider is enabled on the project */
fetch(SUPABASE_URL+'/auth/v1/settings',{headers:{apikey:SUPABASE_ANON}}).then(r=>r.json()).then(j=>{
if(j&&j.external&&j.external.google) $('gwrap').style.display='block';
}).catch(()=>{});
$('google_btn').addEventListener('click', async ()=>{
clearMsg();
const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/account.html'}});
if(error) msg(error.message);
});

/* logout */
$('logout').addEventListener('click', async ()=>{
await sb.auth.signOut();
showAuth();
setMode('login');
$('password').value='';
});

setMode('signup');
</script>
</body>
</html>
